<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftGPT</title>
    <!-- Marked.js para interpretar Markdown real (** y ##) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- JSZip para empaquetar y descargar el datapack modificado -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #212121;
            color: #ececec;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #header {
            padding: 14px 24px;
            font-size: 18px;
            font-weight: bold;
            background-color: #212121;
            border-bottom: 1px solid #2f2f2f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            scrollbar-width: none;
        }
        #chat-container::-webkit-scrollbar { display: none; }
        .message { display: flex; gap: 12px; line-height: 1.6; }
        .user { justify-content: flex-end; }
        .user .bubble {
            background-color: #303030;
            color: #fff;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            white-space: pre-wrap;
        }
        .assistant { justify-content: flex-start; width: 100%; }
        .assistant .bubble {
            background-color: transparent;
            color: #ececec;
            padding: 12px 0;
            max-width: 100%;
            font-family: inherit;
        }
        /* Estilos Markdown */
        .assistant .bubble h1, .assistant .bubble h2, .assistant .bubble h3 {
            margin: 12px 0 6px 0;
            color: #fff;
        }
        .assistant .bubble p { margin-bottom: 10px; }
        .assistant .bubble ul, .assistant .bubble ol { margin-left: 20px; margin-bottom: 10px; }
        
        /* Bloques de código estilo Gemini */
        .code-block-wrapper {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            margin: 12px 0;
            overflow: hidden;
        }
        .code-header {
            background-color: #2a2a2a;
            padding: 6px 12px;
            font-size: 12px;
            color: #b0b0b0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .copy-btn {
            background: transparent;
            border: none;
            color: #b0b0b0;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .copy-btn:hover { background-color: #383838; color: #fff; }
        .code-block-wrapper pre {
            padding: 12px;
            overflow-x: auto;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            color: #dcdcdc;
        }

        .loading { color: #888; font-style: italic; }
        #input-container { padding: 20px; background-color: #212121; }
        .input-box {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            background-color: #2f2f2f;
            border-radius: 24px;
            padding: 8px 12px;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        select, .custom-btn-select {
            background-color: #383838;
            color: #ececec;
            border: none;
            padding: 6px 10px;
            border-radius: 16px;
            outline: none;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        select:hover, .custom-btn-select:hover { background-color: #444; }
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
            resize: none;
            max-height: 150px;
            font-family: inherit;
            padding: 4px 0;
            scrollbar-width: none;
        }
        textarea::-webkit-scrollbar { display: none; }
        
        #file-indicator {
            font-size: 11px;
            color: #4CAF50;
            position: absolute;
            top: -22px;
            left: 16px;
            background: #252525;
            padding: 2px 8px;
            border-radius: 8px;
            display: none;
        }
        button.send-btn {
            background-color: #676767;
            border: none;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            min-width: 32px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button.send-btn:hover { background-color: #8e8e8e; }
        .download-zip-btn {
            background-color: #2b5c3f;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .download-zip-btn:hover { background-color: #367c53; }
    </style>
</head>
<body>
    <div id="header">
        <span>CraftGPT</span>
        <button class="download-zip-btn" onclick="downloadDatapackZip()">📦 Descargar Datapack Modificado (.zip)</button>
    </div>
    
    <div id="chat-container"></div>
    
    <div id="input-container">
        <div class="input-box">
            <div id="file-indicator"></div>
            <select id="model-select" title="Seleccionar modelo">
                <option value="gemini-3.6-flash">Flash 3.6</option>
                <option value="gemini-3.5-flash-lite">Flash-Lite</option>
                <option value="gemini-1.5-flash">Flash 1.5</option>
            </select>
            <select id="version-select" title="Versión de Minecraft">
                <option value="1.21.x">MC 1.21+</option>
                <option value="1.20.x">MC 1.20</option>
                <option value="1.19.x">MC 1.19</option>
                <option value="1.18.x">MC 1.18</option>
            </select>
            <label class="custom-btn-select" title="Adjuntar archivo (.mcfunction, .json, .txt)">
                +
                <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(event)">
            </label>
            <textarea id="user-input" rows="1" placeholder="Pide un comando, datapack o plugin de Minecraft..."></textarea>
            <button class="send-btn" onclick="sendMessage()">↑</button>
        </div>
    </div>

    <script>
        let chatHistory = [];
        let attachedFileText = null;
        let attachedFileName = "";
        let lastAssistantFiles = {};

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                attachedFileText = e.target.result;
                attachedFileName = file.name;
                const indicator = document.getElementById('file-indicator');
                indicator.textContent = `📎 Archivo adjunto: ${file.name}`;
                indicator.style.display = 'block';
            };
            reader.readAsText(file);
        }

        function formatMarkdown(text) {
            let html = marked.parse(text);
            
            html = html.replace(/<pre><code(?:\s+class="([^"]*)")?>([\s\S]*?)<\/code><\/pre>/g, (match, langClass, codeContent) => {
                const lang = langClass ? langClass.replace('language-', '') : 'código';
                const uniqueId = 'code-' + Math.random().toString(36).substr(2, 9);
                
                return `
                    <div class="code-block-wrapper">
                        <div class="code-header">
                            <span>${lang}</span>
                            <button class="copy-btn" onclick="copyCode('${uniqueId}')">Copiar</button>
                        </div>
                        <pre><code id="${uniqueId}">${codeContent}</code></pre>
                    </div>
                `;
            });

            return html;
        }

        function copyCode(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const text = el.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = el.closest('.code-block-wrapper').querySelector('.copy-btn');
                btn.textContent = '¡Copiado!';
                setTimeout(() => { btn.textContent = 'Copiar'; }, 2000);
            });
        }

        async function downloadDatapackZip() {
            if (Object.keys(lastAssistantFiles).length === 0) {
                alert('No hay archivos generados recientes para empaquetar en ZIP.');
                return;
            }
            const zip = new JSZip();
            for (const [filePath, content] of Object.entries(lastAssistantFiles)) {
                zip.file(filePath, content);
            }
            const content = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'datapack_modificado.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function extractFilesFromResponse(text) {
            const regex = /===\s*ARCHIVO:\s*([^\s=]+)\s*===\s*([\s\S]*?)(?=(===\s*ARCHIVO:|$))/g;
            let match;
            while ((match = regex.exec(text)) !== null) {
                const filePath = match[1].trim();
                const fileContent = match[2].trim();
                lastAssistantFiles[filePath] = fileContent;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-container');
            const modelSelect = document.getElementById('model-select');
            const versionSelect = document.getElementById('version-select');
            let text = input.value.trim();

            if (!text && !attachedFileText) return;

            let messageToSend = text;
            if (attachedFileText) {
                messageToSend = `[Archivo adjunto: ${attachedFileName}]\n\`\`\`\n${attachedFileText}\n\`\`\`\n\n${text}`;
                attachedFileText = null;
                attachedFileName = "";
                document.getElementById('file-indicator').style.display = 'none';
                document.getElementById('file-input').value = "";
            }

            chat.innerHTML += `<div class="message user"><div class="bubble">${messageToSend}</div></div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            chatHistory.push({
                role: "user",
                parts: [{ text: messageToSend }]
            });

            const loadingId = 'loading-' + Date.now();
            chat.innerHTML += `<div class="message assistant" id="${loadingId}"><div class="bubble loading">Pensando (${modelSelect.value} | ${versionSelect.value})...</div></div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: chatHistory,
                        model: modelSelect.value,
                        version: versionSelect.value
                    })
                });
                
                const data = await res.json();
                
                document.getElementById(loadingId).remove();
                
                extractFilesFromResponse(data.respuesta);

                const formattedHtml = formatMarkdown(data.respuesta);
                chat.innerHTML += `<div class="message assistant"><div class="bubble">${formattedHtml}</div></div>`;

                chatHistory.push({
                    role: "model",
                    parts: [{ text: data.respuesta }]
                });

            } catch(e) {
                document.getElementById(loadingId).remove();
                chat.innerHTML += `<div class="message assistant"><div class="bubble" style="color: #ff6b6b;">Error de conexión con el servidor.</div></div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>

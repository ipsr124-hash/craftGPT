<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Minecraft</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #212121;
            color: #ececec;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            padding: 10px 20px;
            background-color: #2a2a2a;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        select {
            background-color: #383838;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .message { display: flex; gap: 12px; line-height: 1.6; }
        .user { justify-content: flex-end; }
        .user .bubble {
            background-color: #303030;
            color: #fff;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
        }
        .assistant { justify-content: flex-start; }
        .assistant .bubble {
            background-color: transparent;
            color: #ececec;
            padding: 12px 0;
            max-width: 100%;
            white-space: pre-wrap;
            font-family: inherit;
        }
        .loading { color: #888; font-style: italic; }
        #input-container { padding: 20px; background-color: #212121; }
        .input-box {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            background-color: #2f2f2f;
            border-radius: 24px;
            padding: 8px 16px;
            align-items: center;
        }
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
            resize: none;
            max-height: 150px;
            font-family: inherit;
        }
        button {
            background-color: #676767;
            border: none;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            margin-left: 8px;
            font-weight: bold;
        }
        button:hover { background-color: #8e8e8e; }
    </style>
</head>
<body>
    <div id="header">
        <label for="model-select">Modelo:</label>
        <select id="model-select">
            <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
            <option value="gemini-2.0-flash-lite">Gemini Flash-Lite</option>
            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        </select>
    </div>

    <div id="chat-container"></div>
    
    <div id="input-container">
        <div class="input-box">
            <textarea id="user-input" rows="1" placeholder="Pide un comando, datapack o plugin de Minecraft..."></textarea>
            <button onclick="sendMessage()">↑</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-container');
            const modelSelect = document.getElementById('model-select');
            const text = input.value.trim();
            if(!text) return;

            chat.innerHTML += `<div class="message user"><div class="bubble">${text}</div></div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chat.innerHTML += `<div class="message assistant" id="${loadingId}"><div class="bubble loading">Pensando (${modelSelect.value})...</div></div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        prompt: text,
                        model: modelSelect.value
                    })
                });
                
                const data = await res.json();
                
                document.getElementById(loadingId).remove();
                chat.innerHTML += `<div class="message assistant"><div class="bubble">${data.respuesta}</div></div>`;
            } catch(e) {
                document.getElementById(loadingId).remove();
                chat.innerHTML += `<div class="message assistant"><div class="bubble" style="color: #ff6b6b;">Error de conexión con el servidor.</div></div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftGPT</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #212121;
            color: #ececec;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* --- SIDEBAR --- */
        #sidebar {
            width: 260px;
            background-color: #171717;
            border-right: 1px solid #2f2f2f;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .sidebar-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
        }
        .new-chat-btn {
            width: 100%;
            background-color: #ececec;
            color: #171717;
            border: none;
            padding: 10px;
            border-radius: 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .new-chat-btn:hover { background-color: #fff; }
        
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scrollbar-width: thin;
            scrollbar-color: #444 transparent;
        }
        .chat-item {
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #b0b0b0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item:hover { background-color: #2a2a2a; color: #ececec; }
        .chat-item.active { background-color: #333; color: #fff; font-weight: 500; }
        .chat-title-text {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .delete-chat-btn {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            display: none;
            padding: 4px;
            border-radius: 6px;
        }
        .chat-item:hover .delete-chat-btn { display: block; }
        .delete-chat-btn:hover { color: #ff6b6b; background-color: #444; }

        /* --- CONTENIDO PRINCIPAL --- */
        #main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0; /* Necesario para que flexbox no desborde */
        }
        
        #header {
            padding: 14px 24px;
            font-size: 18px;
            font-weight: bold;
            background-color: #212121;
            border-bottom: 1px solid #2f2f2f;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            margin-right: 12px;
        }

        .header-title-container { display: flex; align-items: center; }
        .header-actions { display: flex; gap: 10px; }

        /* Botón de borrar chat en gris */
        .delete-btn {
            background-color: #333;
            color: #b0b0b0;
            border-color: #444;
        }
        .delete-btn:hover { background-color: #444; color: #fff; }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            scrollbar-width: none;
        }
        #chat-container::-webkit-scrollbar { display: none; }
        .message { display: flex; gap: 12px; line-height: 1.6; }
        .user { justify-content: flex-end; }
        .user .bubble {
            background-color: #303030;
            color: #fff;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            white-space: pre-wrap;
        }
        .assistant { justify-content: flex-start; width: 100%; }
        .assistant .bubble {
            background-color: transparent;
            color: #ececec;
            padding: 12px 0;
            max-width: 100%;
            font-family: inherit;
        }
        .assistant .bubble h1, .assistant .bubble h2, .assistant .bubble h3 { margin: 12px 0 6px 0; color: #fff; }
        .assistant .bubble p { margin-bottom: 10px; }
        .assistant .bubble ul, .assistant .bubble ol { margin-left: 20px; margin-bottom: 10px; }
        
        /* Pestaña de archivo y Código */
        .minimal-file-path {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #2a2a2a;
            color: #9cdcfe;
            padding: 4px 10px;
            border-radius: 6px 6px 0 0;
            font-size: 12px;
            font-family: Consolas, monospace;
            border: 1px solid #333;
            border-bottom: none;
            margin-top: 14px;
            margin-bottom: -12px;
            position: relative;
            z-index: 1;
        }
        .code-block-wrapper {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            margin: 12px 0;
            overflow: hidden;
            position: relative;
            z-index: 0;
        }
        .code-header {
            background-color: #2a2a2a;
            padding: 6px 12px;
            font-size: 12px;
            color: #b0b0b0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .copy-btn {
            background: transparent;
            border: none;
            color: #b0b0b0;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .copy-btn:hover { background-color: #383838; color: #fff; }
        .code-block-wrapper pre {
            padding: 16px;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            color: #dcdcdc;
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-x: hidden;
        }

        .loading-action { color: #888; font-style: italic; display: flex; align-items: center; gap: 8px; }
        
        /* Botón descargar Datapack */
        .datapack-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            max-width: 380px;
        }
        .datapack-info { display: flex; align-items: center; gap: 12px; }
        .datapack-icon-box {
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9cdcfe;
        }
        .datapack-filename { font-size: 14px; color: #ececec; font-weight: 500; }
        .datapack-download-btn {
            background: transparent;
            border: 1px solid #444;
            color: #ececec;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .datapack-download-btn:hover { background-color: #333; border-color: #555; }

        /* Entradas y botones inferiores */
        #input-container { padding: 20px; background-color: #212121; }
        .input-box {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            background-color: #2f2f2f;
            border-radius: 24px;
            padding: 8px 12px;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        
        .custom-btn {
            background-color: #383838;
            color: #ececec;
            border: 1px solid #4f4f4f;
            padding: 6px 14px;
            border-radius: 18px;
            outline: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }
        .custom-btn:hover { background-color: #444; border-color: #666; }

        /* Dropdowns */
        .custom-dropdown { position: relative; display: inline-block; }
        .dropdown-menu {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            background-color: #2a2a2a;
            border: 1px solid #4f4f4f;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.5);
            z-index: 100;
            min-width: 200px;
            overflow: hidden;
            padding: 6px 0;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-group-title {
            padding: 8px 14px 4px 14px;
            font-size: 11px;
            font-weight: bold;
            color: #888;
            text-transform: uppercase;
        }
        .dropdown-item {
            padding: 8px 14px;
            font-size: 13px;
            color: #ececec;
            cursor: pointer;
            font-weight: 500;
        }
        .dropdown-item:hover { background-color: #383838; color: #fff; }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
            resize: none;
            max-height: 150px;
            font-family: inherit;
            padding: 4px 0;
            scrollbar-width: none;
        }
        textarea::-webkit-scrollbar { display: none; }
        
        #file-indicator {
            font-size: 11px;
            color: #4CAF50;
            position: absolute;
            top: -22px;
            left: 16px;
            background: #252525;
            padding: 2px 8px;
            border-radius: 8px;
            display: none;
        }
        button.send-btn {
            background-color: #676767;
            border: none;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            min-width: 32px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button.send-btn:hover { background-color: #8e8e8e; }

        /* Adaptación móvil (ocultar sidebar) */
        @media (max-width: 768px) {
            #sidebar {
                position: absolute;
                height: 100vh;
                transform: translateX(-100%);
            }
            #sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
            #header { padding: 10px 16px; font-size: 16px; }
            #input-container { padding: 10px; }
            .input-box { flex-wrap: wrap; border-radius: 16px; padding: 8px 10px; gap: 6px; }
            .custom-btn { font-size: 12px; padding: 5px 10px; }
            textarea { width: 100%; order: 10; padding: 4px 2px; }
            .send-btn { order: 11; margin-left: auto; }
        }
        
        /* Fondo semitransparente para móvil cuando el sidebar está abierto */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        #overlay.show { display: block; }
    </style>
</head>
<body>
    <!-- Panel Lateral -->
    <div id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="createNewChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nuevo Chat
            </button>
        </div>
        <div class="chat-list" id="chat-list">
            <!-- Lista de chats inyectada por JS -->
        </div>
    </div>
    
    <div id="overlay" onclick="toggleSidebar()"></div>

    <!-- Contenido Principal -->
    <div id="main-wrapper">
        <div id="header">
            <div class="header-title-container">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <span>CraftGPT</span>
            </div>
            <div class="header-actions">
                <button class="custom-btn delete-btn" onclick="clearCurrentChat()" title="Borrar chat actual">Limpiar Chat</button>
            </div>
        </div>
        
        <div id="chat-container"></div>
        
        <div id="input-container">
            <div class="input-box">
                <div id="file-indicator"></div>

                <div class="custom-dropdown" id="model-dropdown">
                    <button type="button" class="custom-btn" onclick="toggleMenu('model-menu', event)">
                        <span id="model-selected-text">Flash 3.6</span>
                        <span style="font-size: 10px; opacity: 0.7;">▼</span>
                    </button>
                    <div class="dropdown-menu" id="model-menu">
                        <div class="dropdown-group-title">Gemini</div>
                        <div class="dropdown-item" onclick="selectModel('gemini-3.6-flash', 'Flash 3.6')">Flash 3.6</div>
                        <div class="dropdown-item" onclick="selectModel('gemini-3.5-flash-lite', 'Flash 3.5 Lite')">Flash 3.5 Lite</div>
                        <div class="dropdown-group-title">OpenRouter</div>
                        <div class="dropdown-item" onclick="selectModel('cohere/north-mini-code:free', 'North Mini Code')">North Mini Code</div>
                        <div class="dropdown-item" onclick="selectModel('nvidia/nemotron-3-ultra-550b-a55b:free', 'Nemotron Ultra')">Nemotron Ultra</div>
                    </div>
                </div>

                <div class="custom-dropdown" id="version-dropdown">
                    <button type="button" class="custom-btn" onclick="toggleMenu('version-menu', event)">
                        <span id="version-selected-text">MC 26.2</span>
                        <span style="font-size: 10px; opacity: 0.7;">▼</span>
                    </button>
                    <div class="dropdown-menu" id="version-menu">
                        <div class="dropdown-item" onclick="selectVersion('26.2', 'MC 26.2')">MC 26.2</div>
                        <div class="dropdown-item" onclick="selectVersion('1.21.x', 'MC 1.21+')">MC 1.21+</div>
                        <div class="dropdown-item" onclick="selectVersion('1.20.x', 'MC 1.20')">MC 1.20</div>
                        <div class="dropdown-item" onclick="selectVersion('1.19.x', 'MC 1.19')">MC 1.19</div>
                        <div class="dropdown-item" onclick="selectVersion('1.18.x', 'MC 1.18')">MC 1.18</div>
                    </div>
                </div>

                <label class="custom-btn" title="Adjuntar archivo">
                    + <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(event)">
                </label>
                <textarea id="user-input" rows="1" placeholder="Escribe un mensaje..."></textarea>
                <button class="send-btn" onclick="sendMessage()">↑</button>
            </div>
        </div>
    </div>

    <script>
        // --- SISTEMA DE SESIONES Y CHATS ---
        let sessions = JSON.parse(localStorage.getItem('craftgpt_sessions')) || [];
        let currentSessionId = localStorage.getItem('craftgpt_current_session_id') || null;
        let chatHistory = [];
        let attachedFileText = null;
        let attachedFileName = "";
        let currentModel = 'gemini-3.6-flash';
        let currentVersion = '26.2';

        const geminiThoughts = ["Analizando la estructura...", "Procesando respuesta...", "Generando código...", "Finalizando..."];

        window.onload = () => {
            // Migración desde versión anterior 0.6.2
            if (sessions.length === 0 && localStorage.getItem('craftgpt_chat_history')) {
                const oldHistory = JSON.parse(localStorage.getItem('craftgpt_chat_history'));
                if (oldHistory.length > 0) {
                    const newSession = {
                        id: Date.now().toString(),
                        title: "Chat anterior",
                        history: oldHistory
                    };
                    sessions.push(newSession);
                    currentSessionId = newSession.id;
                    localStorage.removeItem('craftgpt_chat_history');
                    localStorage.removeItem('craftgpt_chat_html');
                    saveSessionsToLocal();
                }
            }

            if (!currentSessionId || !sessions.find(s => s.id === currentSessionId)) {
                createNewChat(false); // Crea si no hay nada
            } else {
                loadSession(currentSessionId);
            }
            renderSidebar();
        };

        function saveSessionsToLocal() {
            localStorage.setItem('craftgpt_sessions', JSON.stringify(sessions));
            localStorage.setItem('craftgpt_current_session_id', currentSessionId);
            renderSidebar();
        }

        function createNewChat(render = true) {
            const newSessionId = Date.now().toString();
            sessions.unshift({
                id: newSessionId,
                title: "Nuevo Chat",
                history: []
            });
            currentSessionId = newSessionId;
            chatHistory = [];
            saveSessionsToLocal();
            document.getElementById('chat-container').innerHTML = '';
            
            // Cerrar sidebar en móvil si se crea uno nuevo
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = sessions.find(s => s.id === id);
            chatHistory = session ? session.history : [];
            saveSessionsToLocal();
            renderChatHistory();
            
            // Cerrar sidebar en móvil al seleccionar chat
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }

        function deleteSession(id, event) {
            event.stopPropagation();
            if(confirm("¿Borrar este chat?")) {
                sessions = sessions.filter(s => s.id !== id);
                if (sessions.length === 0) {
                    createNewChat();
                } else if (currentSessionId === id) {
                    loadSession(sessions[0].id);
                } else {
                    saveSessionsToLocal();
                }
            }
        }

        function clearCurrentChat() {
            if (confirm("¿Estás seguro de que quieres borrar TODA esta conversación?")) {
                chatHistory = [];
                const session = sessions.find(s => s.id === currentSessionId);
                if(session) {
                    session.history = [];
                    session.title = "Nuevo Chat";
                }
                saveSessionsToLocal();
                document.getElementById('chat-container').innerHTML = '';
            }
        }

        function renderSidebar() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            sessions.forEach(session => {
                const isActive = session.id === currentSessionId ? 'active' : '';
                list.innerHTML += `
                    <div class="chat-item ${isActive}" onclick="loadSession('${session.id}')">
                        <span class="chat-title-text">${session.title}</span>
                        <button class="delete-chat-btn" onclick="deleteSession('${session.id}', event)">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `;
            });
        }

        function renderChatHistory() {
            const chat = document.getElementById('chat-container');
            chat.innerHTML = '';
            chatHistory.forEach(msg => {
                if (msg.role === 'user') {
                    chat.innerHTML += `<div class="message user"><div class="bubble">${msg.parts[0].text}</div></div>`;
                } else {
                    const responseFiles = extractFilesFromResponse(msg.parts[0].text);
                    const formattedHtml = formatMarkdown(msg.parts[0].text);
                    let messageHtml = `<div class="message assistant"><div class="bubble">${formattedHtml}`;
                    
                    if (Object.keys(responseFiles).length > 0) {
                        const uniqueBtnId = 'download-btn-' + Math.random().toString(36).substr(2, 9);
                        window[uniqueBtnId] = responseFiles;
                        messageHtml += `
                            <div class="datapack-card">
                                <div class="datapack-info">
                                    <div class="datapack-icon-box">📦</div>
                                    <span class="datapack-filename">datapack_generado.zip</span>
                                </div>
                                <button class="datapack-download-btn" onclick="downloadDatapackZip(window['${uniqueBtnId}'])">Descargar</button>
                            </div>
                        `;
                    }
                    messageHtml += `</div></div>`;
                    chat.innerHTML += messageHtml;
                }
            });
            chat.scrollTop = chat.scrollHeight;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        // --- SISTEMA DE DROPDOWNS ---
        function toggleMenu(menuId, event) {
            event.stopPropagation();
            const menu = document.getElementById(menuId);
            document.querySelectorAll('.dropdown-menu').forEach(m => {
                if (m.id !== menuId) m.classList.remove('show');
            });
            menu.classList.toggle('show');
        }

        function selectModel(value, label) {
            currentModel = value;
            document.getElementById('model-selected-text').textContent = label;
            document.getElementById('model-menu').classList.remove('show');
        }

        function selectVersion(value, label) {
            currentVersion = value;
            document.getElementById('version-selected-text').textContent = label;
            document.getElementById('version-menu').classList.remove('show');
        }

        window.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
        });

        // --- MANEJO DE ARCHIVOS Y RENDERIZADO ---
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                attachedFileText = e.target.result;
                attachedFileName = file.name;
                const indicator = document.getElementById('file-indicator');
                indicator.textContent = `📎 ${file.name}`;
                indicator.style.display = 'block';
            };
            reader.readAsText(file);
        }

        function formatMarkdown(text) {
            let processedText = text.replace(/===\s*ARCHIVO:\s*([^\s=]+)\s*===/g, 
                '\n<div class="minimal-file-path">📁 $1</div>\n'
            );
            let html = marked.parse(processedText);
            html = html.replace(/<pre><code(?:\s+class="([^"]*)")?>([\s\S]*?)<\/code><\/pre>/g, (match, langClass, codeContent) => {
                const lang = langClass ? langClass.replace('language-', '') : 'código';
                const uniqueId = 'code-' + Math.random().toString(36).substr(2, 9);
                return `
                    <div class="code-block-wrapper">
                        <div class="code-header">
                            <span>${lang}</span>
                            <button class="copy-btn" onclick="copyCode('${uniqueId}')">Copiar</button>
                        </div>
                        <pre><code id="${uniqueId}">${codeContent}</code></pre>
                    </div>
                `;
            });
            return html;
        }

        function copyCode(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            navigator.clipboard.writeText(el.innerText).then(() => {
                const btn = el.closest('.code-block-wrapper').querySelector('.copy-btn');
                btn.textContent = '¡Copiado!';
                setTimeout(() => { btn.textContent = 'Copiar'; }, 2000);
            });
        }

        async function downloadDatapackZip(filesObj) {
            const zip = new JSZip();
            for (const [filePath, content] of Object.entries(filesObj)) { zip.file(filePath, content); }
            const content = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url; a.download = 'datapack_generado.zip';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function extractFilesFromResponse(text) {
            const regex = /===\s*ARCHIVO:\s*([^\s=]+)\s*===\s*([\s\S]*?)(?=(===\s*ARCHIVO:|$))/g;
            let match; let extracted = {};
            while ((match = regex.exec(text)) !== null) {
                extracted[match[1].trim()] = match[2].trim();
            }
            return extracted;
        }

        // --- ENVÍO DE MENSAJES ---
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-container');
            let text = input.value.trim();

            if (!text && !attachedFileText) return;

            let messageToSend = text;
            if (attachedFileText) {
                messageToSend = `[Archivo adjunto: ${attachedFileName}]\n\`\`\`\n${attachedFileText}\n\`\`\`\n\n${text}`;
                attachedFileText = null;
                attachedFileName = "";
                document.getElementById('file-indicator').style.display = 'none';
                document.getElementById('file-input').value = "";
            }

            // Cambiar título si es el primer mensaje
            const session = sessions.find(s => s.id === currentSessionId);
            if (session && session.history.length === 0) {
                session.title = text.substring(0, 25) + (text.length > 25 ? '...' : '');
            }

            chat.innerHTML += `<div class="message user"><div class="bubble">${messageToSend}</div></div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            chatHistory.push({ role: "user", parts: [{ text: messageToSend }] });
            saveSessionsToLocal();

            const loadingId = 'loading-' + Date.now();
            let thoughtIndex = 0;
            chat.innerHTML += `
                <div class="message assistant" id="${loadingId}">
                    <div class="bubble loading-action"><span id="${loadingId}-text">${geminiThoughts[0]}</span></div>
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;

            const thoughtInterval = setInterval(() => {
                thoughtIndex = (thoughtIndex + 1) % geminiThoughts.length;
                const textSpan = document.getElementById(`${loadingId}-text`);
                if (textSpan) textSpan.textContent = geminiThoughts[thoughtIndex];
            }, 1800);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: chatHistory, model: currentModel, version: currentVersion })
                });
                
                const data = await res.json();
                
                clearInterval(thoughtInterval);
                document.getElementById(loadingId).remove();
                
                chatHistory.push({ role: "model", parts: [{ text: data.respuesta }] });
                saveSessionsToLocal();
                
                // Recargar toda la vista para incluir los botones y markdown correctamente
                renderChatHistory();

            } catch(e) {
                clearInterval(thoughtInterval);
                document.getElementById(loadingId).remove();
                chat.innerHTML += `<div class="message assistant"><div class="bubble" style="color: #ff6b6b;">Error de conexión.</div></div>`;
            }
        }

        document.getElementById("user-input").addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftGPT</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #212121;
            color: #ececec;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #header {
            padding: 14px 24px;
            font-size: 18px;
            font-weight: bold;
            background-color: #212121;
            border-bottom: 1px solid #2f2f2f;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-actions { display: flex; gap: 10px; }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            scrollbar-width: none;
        }
        #chat-container::-webkit-scrollbar { display: none; }
        .message { display: flex; gap: 12px; line-height: 1.6; }
        .user { justify-content: flex-end; }
        .user .bubble {
            background-color: #303030;
            color: #fff;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            white-space: pre-wrap;
        }
        .assistant { justify-content: flex-start; width: 100%; }
        .assistant .bubble {
            background-color: transparent;
            color: #ececec;
            padding: 12px 0;
            max-width: 100%;
            font-family: inherit;
        }
        .assistant .bubble h1, .assistant .bubble h2, .assistant .bubble h3 {
            margin: 12px 0 6px 0;
            color: #fff;
        }
        .assistant .bubble p { margin-bottom: 10px; }
        .assistant .bubble ul, .assistant .bubble ol { margin-left: 20px; margin-bottom: 10px; }
        
        /* Pestaña de archivo minimalista */
        .minimal-file-path {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #2a2a2a;
            color: #9cdcfe;
            padding: 4px 10px;
            border-radius: 6px 6px 0 0;
            font-size: 12px;
            font-family: Consolas, monospace;
            border: 1px solid #333;
            border-bottom: none;
            margin-top: 14px;
            margin-bottom: -12px;
            position: relative;
            z-index: 1;
        }

        /* Código sin scroll horizontal */
        .code-block-wrapper {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            margin: 12px 0;
            overflow: hidden;
            position: relative;
            z-index: 0;
        }
        .code-header {
            background-color: #2a2a2a;
            padding: 6px 12px;
            font-size: 12px;
            color: #b0b0b0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .copy-btn {
            background: transparent;
            border: none;
            color: #b0b0b0;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .copy-btn:hover { background-color: #383838; color: #fff; }
        
        .code-block-wrapper pre {
            padding: 16px;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            color: #dcdcdc;
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-x: hidden;
        }

        .loading-action { color: #888; font-style: italic; display: flex; align-items: center; gap: 8px; }
        
        /* Botón descargar Datapack */
        .datapack-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            max-width: 380px;
        }
        .datapack-info { display: flex; align-items: center; gap: 12px; }
        .datapack-icon-box {
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9cdcfe;
        }
        .datapack-filename { font-size: 14px; color: #ececec; font-weight: 500; }
        .datapack-download-btn {
            background: transparent;
            border: 1px solid #444;
            color: #ececec;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .datapack-download-btn:hover { background-color: #333; border-color: #555; }

        #input-container { padding: 20px; background-color: #212121; }
        .input-box {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            background-color: #2f2f2f;
            border-radius: 24px;
            padding: 8px 12px;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        select, .custom-btn {
            background-color: #383838;
            color: #ececec;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            outline: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        select:hover, .custom-btn:hover { background-color: #444; }
        .delete-btn { background-color: #4a2b2b; color: #ff8585; }
        .delete-btn:hover { background-color: #5e3535; }
        
        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
            resize: none;
            max-height: 150px;
            font-family: inherit;
            padding: 4px 0;
            scrollbar-width: none;
        }
        textarea::-webkit-scrollbar { display: none; }
        
        #file-indicator {
            font-size: 11px;
            color: #4CAF50;
            position: absolute;
            top: -22px;
            left: 16px;
            background: #252525;
            padding: 2px 8px;
            border-radius: 8px;
            display: none;
        }
        button.send-btn {
            background-color: #676767;
            border: none;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            min-width: 32px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button.send-btn:hover { background-color: #8e8e8e; }
    </style>
</head>
<body>
    <div id="header">
        <span>CraftGPT</span>
        <div class="header-actions">
            <!-- Botón de papelera para limpiar el chat -->
            <button class="custom-btn delete-btn" onclick="clearChat()" title="Borrar toda la conversación">🗑️ Limpiar Chat</button>
        </div>
    </div>
    
    <div id="chat-container"></div>
    
    <div id="input-container">
        <div class="input-box">
            <div id="file-indicator"></div>
            <select id="model-select" title="Seleccionar modelo">
                <option value="gemini-3.6-flash">Flash 3.6</option>
                <option value="gemini-3.5-flash-lite">Flash 3.5 Lite</option>
            </select>
            <select id="version-select" title="Versión de Minecraft">
                <option value="26.2">MC 26.2</option>
                <option value="1.21.x">MC 1.21+</option>
                <option value="1.20.x">MC 1.20</option>
                <option value="1.19.x">MC 1.19</option>
                <option value="1.18.x">MC 1.18</option>
            </select>
            <label class="custom-btn" title="Adjuntar archivo (.mcfunction, .json, .txt)">
                +
                <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(event)">
            </label>
            <textarea id="user-input" rows="1" placeholder="Escribe un mensaje..."></textarea>
            <button class="send-btn" onclick="sendMessage()">↑</button>
        </div>
    </div>

    <script>
        let chatHistory = [];
        let attachedFileText = null;
        let attachedFileName = "";

        const geminiThoughts = [
            "Analizando la estructura...",
            "Procesando respuesta...",
            "Generando código...",
            "Finalizando..."
        ];

        // --- SISTEMA DE GUARDADO EN NAVEGADOR (LocalStorage) ---
        window.onload = () => {
            const savedChat = localStorage.getItem('craftgpt_chat_html');
            const savedHistory = localStorage.getItem('craftgpt_chat_history');
            
            if (savedChat && savedHistory) {
                document.getElementById('chat-container').innerHTML = savedChat;
                chatHistory = JSON.parse(savedHistory);
                const chat = document.getElementById('chat-container');
                chat.scrollTop = chat.scrollHeight;
            }
        };

        function saveChatToLocal() {
            const chatContainer = document.getElementById('chat-container').innerHTML;
            localStorage.setItem('craftgpt_chat_html', chatContainer);
            localStorage.setItem('craftgpt_chat_history', JSON.stringify(chatHistory));
        }

        function clearChat() {
            if (confirm("¿Estás seguro de que quieres borrar TODA la conversación? Esto no se puede deshacer.")) {
                localStorage.removeItem('craftgpt_chat_html');
                localStorage.removeItem('craftgpt_chat_history');
                document.getElementById('chat-container').innerHTML = '';
                chatHistory = [];
            }
        }
        // --------------------------------------------------------

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                attachedFileText = e.target.result;
                attachedFileName = file.name;
                const indicator = document.getElementById('file-indicator');
                indicator.textContent = `📎 Archivo adjunto: ${file.name}`;
                indicator.style.display = 'block';
            };
            reader.readAsText(file);
        }

        function formatMarkdown(text) {
            let processedText = text.replace(/===\s*ARCHIVO:\s*([^\s=]+)\s*===/g, 
                '\n<div class="minimal-file-path"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg> $1</div>\n'
            );

            let html = marked.parse(processedText);
            
            html = html.replace(/<pre><code(?:\s+class="([^"]*)")?>([\s\S]*?)<\/code><\/pre>/g, (match, langClass, codeContent) => {
                const lang = langClass ? langClass.replace('language-', '') : 'código';
                const uniqueId = 'code-' + Math.random().toString(36).substr(2, 9);
                
                return `
                    <div class="code-block-wrapper">
                        <div class="code-header">
                            <span>${lang}</span>
                            <button class="copy-btn" onclick="copyCode('${uniqueId}')">Copiar</button>
                        </div>
                        <pre><code id="${uniqueId}">${codeContent}</code></pre>
                    </div>
                `;
            });

            return html;
        }

        function copyCode(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const text = el.innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = el.closest('.code-block-wrapper').querySelector('.copy-btn');
                btn.textContent = '¡Copiado!';
                setTimeout(() => { btn.textContent = 'Copiar'; }, 2000);
            });
        }

        async function downloadDatapackZip(filesObj) {
            const zip = new JSZip();
            for (const [filePath, content] of Object.entries(filesObj)) {
                zip.file(filePath, content);
            }
            const content = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'datapack_generado.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function extractFilesFromResponse(text) {
            const regex = /===\s*ARCHIVO:\s*([^\s=]+)\s*===\s*([\s\S]*?)(?=(===\s*ARCHIVO:|$))/g;
            let match;
            let extracted = {};
            while ((match = regex.exec(text)) !== null) {
                const filePath = match[1].trim();
                const fileContent = match[2].trim();
                extracted[filePath] = fileContent;
            }
            return extracted;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-container');
            const modelSelect = document.getElementById('model-select');
            const versionSelect = document.getElementById('version-select');
            let text = input.value.trim();

            if (!text && !attachedFileText) return;

            let messageToSend = text;
            if (attachedFileText) {
                messageToSend = `[Archivo adjunto: ${attachedFileName}]\n\`\`\`\n${attachedFileText}\n\`\`\`\n\n${text}`;
                attachedFileText = null;
                attachedFileName = "";
                document.getElementById('file-indicator').style.display = 'none';
                document.getElementById('file-input').value = "";
            }

            chat.innerHTML += `<div class="message user"><div class="bubble">${messageToSend}</div></div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            chatHistory.push({
                role: "user",
                parts: [{ text: messageToSend }]
            });
            
            saveChatToLocal(); // Guardar después del usuario

            const loadingId = 'loading-' + Date.now();
            let thoughtIndex = 0;
            
            chat.innerHTML += `
                <div class="message assistant" id="${loadingId}">
                    <div class="bubble loading-action">
                        <span id="${loadingId}-text">${geminiThoughts[0]}</span>
                    </div>
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;

            const thoughtInterval = setInterval(() => {
                thoughtIndex = (thoughtIndex + 1) % geminiThoughts.length;
                const textSpan = document.getElementById(`${loadingId}-text`);
                if (textSpan) {
                    textSpan.textContent = geminiThoughts[thoughtIndex];
                }
            }, 1800);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: chatHistory,
                        model: modelSelect.value,
                        version: versionSelect.value
                    })
                });
                
                const data = await res.json();
                
                clearInterval(thoughtInterval);
                document.getElementById(loadingId).remove();
                
                const responseFiles = extractFilesFromResponse(data.respuesta);
                const formattedHtml = formatMarkdown(data.respuesta);

                let messageHtml = `<div class="message assistant"><div class="bubble">${formattedHtml}`;
                
                if (Object.keys(responseFiles).length > 0) {
                    const uniqueBtnId = 'download-btn-' + Date.now();
                    window[uniqueBtnId] = responseFiles;
                    messageHtml += `
                        <div class="datapack-card">
                            <div class="datapack-info">
                                <div class="datapack-icon-box">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                </div>
                                <span class="datapack-filename">datapack_generado.zip</span>
                            </div>
                            <button class="datapack-download-btn" onclick="downloadDatapackZip(window['${uniqueBtnId}'])">Descargar</button>
                        </div>
                    `;
                }

                messageHtml += `</div></div>`;
                chat.innerHTML += messageHtml;

                chatHistory.push({
                    role: "model",
                    parts: [{ text: data.respuesta }]
                });
                
                saveChatToLocal(); // Guardar después de recibir respuesta

            } catch(e) {
                clearInterval(thoughtInterval);
                document.getElementById(loadingId).remove();
                chat.innerHTML += `<div class="message assistant"><div class="bubble" style="color: #ff6b6b;">Error de conexión con el servidor.</div></div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }

        // Permitir enviar con la tecla Enter (sin shift)
        document.getElementById("user-input").addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
